<!doctype html>
<!-- OBS on-screen chat for the horizontal scenes: Twitch + YouTube from Streamer.bot (ws://127.0.0.1:8080), TikTok from TikFinity (ws://localhost:21213).
     Dark bubbles in Koulen, newest at the bottom. Logo + badges + name always on one line in front of the message.
     Special viewers: GreMi + lead mods gold, mods green, VIPs pink, TikTok top gifters amber, subs/members purple, first-time chatters sparkle.
     Bots from every platform are hidden (chatcore.js). Events (follows, subs, gifts) live in the dock, not here.
     ?fs=20 font px  ?hide=60 seconds (0 = never)  ?max=12 bubbles  ?bg=.62 bubble darkness  ?ignore=a,b extra names
     ?commands=1 show !commands  ?sb=127.0.0.1:8080  ?tikfinity=21213  ?demo sample messages. -->
<html><head><meta charset="utf-8"><title>Chat overlay</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Koulen&display=swap" rel="stylesheet">
<style>
  :root { --fs: 20px; --bg: .62; }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: transparent; overflow: hidden; }
  body { font: 400 var(--fs)/1.18 "Koulen", "Bebas Neue", Impact, sans-serif; color: #fff; letter-spacing: .035em; }
  #list { position: absolute; left: 0; right: 0; bottom: 0; display: flex; flex-direction: column; align-items: flex-start; gap: calc(var(--fs) * .3); }
  .m { position: relative; max-width: 100%; background: rgba(8,6,12,var(--bg)); border-radius: calc(var(--fs) * .45);
       padding: calc(var(--fs) * .3) calc(var(--fs) * .55) calc(var(--fs) * .22); overflow-wrap: anywhere;
       text-shadow: 0 1px 0 #000, 0 0 3px rgba(0,0,0,.9); box-shadow: 0 2px 8px rgba(0,0,0,.35);
       border-left: calc(var(--fs) * .16) solid transparent; animation: in .25s ease-out; transition: opacity .6s, transform .6s; }
  .m.out { opacity: 0; transform: translateX(-12px); }
  .who { white-space: nowrap; margin-right: .35em; }
  .pf, .bd { display: inline-block; width: .95em; height: .95em; vertical-align: -.1em; margin-right: .22em; border-radius: 3px; }
  .n { color: var(--c); }
  .crown { color: #ffd257; margin-right: .2em; }
  .emote { height: 1.3em; vertical-align: middle; margin: -.25em 1px; }
  /* special viewers */
  .t-sub { border-left-color: #9146ff; }
  .t-gifter { border-left-color: #f5b301; }
  .t-vip { border-left-color: #ff4fd8; box-shadow: 0 0 10px rgba(255,79,216,.35); }
  .t-mod { border-left-color: #00d26a; box-shadow: 0 0 10px rgba(0,210,106,.3); }
  .t-gold { border-left-color: #ffcf40; background: linear-gradient(90deg, rgba(70,48,0,calc(var(--bg) + .1)), rgba(8,6,12,var(--bg)) 60%);
            box-shadow: 0 0 14px rgba(255,200,60,.45); }
  .t-gold .n { background: linear-gradient(90deg, #fff1b8, #ffcf40, #fff1b8); background-size: 200% 100%; -webkit-background-clip: text; background-clip: text;
               color: transparent; text-shadow: none; animation: shine 2.5s linear infinite; }
  .first { border-left-color: #25f4ee; }
  .first::after { content: "✦ first chat"; position: absolute; right: calc(var(--fs) * .4); top: calc(var(--fs) * -.55); font-size: .55em; letter-spacing: .1em;
                  padding: 0 .5em; border-radius: 1em; background: linear-gradient(90deg, #e10600, #9146ff); text-shadow: none; animation: pop .6s ease-out; }
  .first { animation: in .25s ease-out, sparkle 1.6s ease-out; }
  @keyframes in { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }
  @keyframes shine { to { background-position: -200% 0; } }
  @keyframes sparkle { 0%, 60% { box-shadow: 0 0 18px rgba(37,244,238,.75); } 100% { box-shadow: 0 2px 8px rgba(0,0,0,.35); } }
  @keyframes pop { from { transform: scale(.4); opacity: 0; } to { transform: none; opacity: 1; } }
</style></head>
<body><div id="list"></div>
<script src="chatcore.js"></script>
<script>
const q = new URLSearchParams(location.search);
if (q.get("fs")) document.documentElement.style.setProperty("--fs", q.get("fs") + "px");
if (q.get("bg")) document.documentElement.style.setProperty("--bg", q.get("bg"));
const HIDE = +(q.get("hide") ?? 60), MAX = +(q.get("max") || 12), SHOW_CMD = q.get("commands") === "1";
const list = document.getElementById("list");
const C = window.GremiChat;

function add(m) {
  if (!SHOW_CMD && /^\s*!/.test(m.text)) return;
  const el = document.createElement("div");
  el.className = `m ${C.tier(m)}${m.roles.has("first") ? " first" : ""}`;
  el.innerHTML = C.who(m) + m.html;
  list.appendChild(el);
  while (list.children.length > MAX) list.firstChild.remove();
  while (list.firstChild && list.offsetHeight > innerHeight) list.firstChild.remove();   // keep inside the box
  if (HIDE > 0) setTimeout(() => { el.classList.add("out"); setTimeout(() => el.remove(), 700); }, HIDE * 1000);
}

if (q.has("demo")) {
  const mk = (platform, name, color, text, roles = [], badges = []) => ({ platform, name, color, text, html: C.esc(text), roles: new Set(roles), badges });
  [mk("twitch", "0verfast", "#ff7b00", "that pass into 130R was insane", ["sub"], [C.BADGE.sub]),
   mk("youtube", "DrewDrew Playz", null, "P4 from P9, GG", ["sub"], [C.BADGE.member]),
   mk("tiktok", "markbonner189", null, "lets gooo", ["gifter"], [C.BADGE.gifter]),
   mk("twitch", "DDRK0", "#3ad07a", "lobby is open, check discord", ["lead", "mod"], [C.BADGE.mod]),
   mk("twitch", "Bananensaus17", "#00c3ff", "fastest lap is mine", ["vip"]),
   mk("twitch", "lisa_simracing", "#ff4fa3", "first time here, is gremi always this fast?", ["first"])].forEach(add);
} else { C.connectSB({ chat: add }); C.connectTF({ chat: add }); }
</script>
</body></html>
