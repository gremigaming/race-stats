<!doctype html>
<!-- OBS browser source: result of the last GreMi Gang race, read from the live league data.
     Updates by itself a few seconds after a race file is uploaded.
     ?rows=8 rows to show (default 8), ?w=690 card width, ?fs=27 row font size,
     ?title=Final%20classification heading, ?big shows the track as a large heading instead. -->
<html><head><meta charset="utf-8"><title>Race result</title>
<link rel="stylesheet" href="brand.css">
<style>
  .card { margin: 10px 24px 30px; }
  .head { display: flex; justify-content: space-between; align-items: flex-end; margin-bottom: 10px; }
  .side { text-align: right; line-height: 1.5; }
  .fl { color: #c58bff; }
  table { width: 100%; border-collapse: collapse; }
  td { padding: 6px 8px; font-weight: 600; border-bottom: 1px solid rgba(255,255,255,.08); white-space: nowrap; }
  td.pos { width: 1.8em; font-weight: 800; text-align: center; }
  td.team { color: var(--dim); font-weight: 500; font-size: .82em; }
  td.time { text-align: right; font-variant-numeric: tabular-nums; }
  td.name { overflow: hidden; text-overflow: ellipsis; max-width: 0; width: 55%; }
  tr.me td { background: rgba(190,40,120,.32); }
  tr.me td:first-child { box-shadow: inset 4px 0 0 #ff3b30; }
  .bar { display: inline-block; width: 6px; height: 1.05em; border-radius: 3px; vertical-align: -0.15em; margin-right: 10px; }
  .dnf { color: var(--dim); }
  tr { animation: rowin .5s ease both; }
  @keyframes rowin { from { opacity: 0; transform: translateX(-12px); } }
</style></head>
<body>
<div class="card fade out" id="card"><div class="streaks"><i></i><i></i><i></i><i></i></div>
  <div class="head"><div><div class="label" id="sub">Last race</div><div class="big" id="title" style="font-size:38px;margin-top:4px">—</div></div>
  <div class="label side">GreMi Gang lobby<br><span class="fl">◆ Fastest lap</span></div></div>
  <table id="rows"></table>
</div>
<script type="module">
import { poll, races, loadSession, classification, isMe, teamColor, fmtLap } from "./league.js";
const q = new URLSearchParams(location.search);
const rows = +(q.get("rows") || 8), fs = +(q.get("fs") || 27);
const card = document.getElementById("card");
card.style.width = (q.get("w") || 690) + "px";
document.getElementById("rows").style.fontSize = fs + "px";
const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));

poll(async (src) => {
  const last = races(src.index)[0];
  if (!last) return;
  const s = await loadSession(src, last.file);
  const list = classification(s);
  const fast = s.records?.fastest?.lap?.["driver-name"];
  const me = list.find((c) => isMe(c.name));
  let shown = list.slice(0, rows);
  if (me && !shown.includes(me)) shown = [...list.slice(0, rows - 1), me];
  document.getElementById("sub").textContent = q.get("title") ? "Last race" : `Last race · ${last.date.toLocaleDateString("en-GB", { day: "2-digit", month: "short" })}`;
  document.getElementById("title").textContent = `${last.track} · ${q.get("title") || "Race result"}`;
  document.getElementById("rows").innerHTML = shown.map((c, i) => {
    const out = c.status && !/FINISHED/i.test(c.status);
    const fl = c.name === fast;
    return `<tr class="${isMe(c.name) ? "me" : ""}" style="animation-delay:${i * 60}ms"><td class="pos">${c.pos}</td>
      <td class="name"><span class="bar" style="background:${teamColor(c.team)}"></span>${esc(c.name)}</td>
      <td class="team">${esc(c.team)}</td>
      <td class="time ${fl ? "fl" : ""} ${out ? "dnf" : ""}">${out ? esc(c.status.replace(/_/g, " ")) : (fl ? "◆ " : "") + fmtLap(c.best)}</td></tr>`;
  }).join("");
  card.classList.remove("out");
  card.classList.remove("sweep"); void card.offsetWidth; card.classList.add("sweep");
});
</script>
</body></html>
