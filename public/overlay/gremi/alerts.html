<!doctype html>
<!-- OBS browser source: every alert in one card, in the socials/giveaway style.
     Listens to Streamer.bot (WebSocket server, default ws://127.0.0.1:8080) for Twitch and YouTube,
     and to TikFinity (ws://localhost:21213) for TikTok. Alerts queue up and show one at a time.
     Size 900 x 300. ?sb=127.0.0.1:8080  ?tikfinity=21213  ?secs=6 time on screen
     ?only=tiktok shows only TikTok alerts, ?skip=tiktok hides them (for the TikTok canvas use only=tiktok)
     ?welcome=0 turns welcome alerts off. ?demo plays every alert type in a loop. -->
<html><head><meta charset="utf-8"><title>Alerts</title>
<link rel="stylesheet" href="brand.css">
<style>
  /* "Hype glow" (picked 2026-11-12): no card, gradient label pill + big glowing name with a glitch, sparks on big alerts. */
  html, body { width: 100%; height: 100%; }
  .wrap { position: fixed; inset: 0; display: flex; justify-content: center; align-items: flex-start; padding-top: 18px; }
  .hype { position: relative; text-align: center; max-width: 880px; opacity: 0; transform: scale(.9); transition: opacity .35s, transform .35s; }
  .hype.show { opacity: 1; transform: none; transition: none; animation: pop .42s cubic-bezier(.2,1.6,.4,1); }
  @keyframes pop { from { opacity: 0; transform: scale(1.6); } to { opacity: 1; transform: none; } }
  .top { display: inline-flex; align-items: center; gap: 9px; padding: 5px 7px 5px 14px; border-radius: 999px;
         background: linear-gradient(90deg, #e10600, #9146ff); box-shadow: 0 0 22px rgba(145,70,255,.7), 0 3px 10px rgba(0,0,0,.5); }
  .top .label { color: #fff; font-weight: 800; font-size: 18px; letter-spacing: .2em; }
  .pf { width: 10px; height: 10px; border-radius: 50%; box-shadow: 0 0 0 2px rgba(0,0,0,.25); }
  .chip { font: 800 16px/1 "Saira Condensed"; letter-spacing: .12em; padding: 4px 10px 3px; border-radius: 999px; text-transform: uppercase;
          color: #fff; background: rgba(0,0,0,.35); }
  .top:not(:has(.chip:not([style*="none"]))) { padding-right: 14px; }
  .nrow { display: flex; align-items: center; justify-content: center; gap: 16px; margin-top: 6px; }
  .name { position: relative; font-weight: 800; font-size: 82px; line-height: 1.02; text-transform: uppercase; white-space: nowrap; color: #fff;
          text-shadow: 0 0 18px rgba(255,255,255,.35), 0 0 40px rgba(145,70,255,.8), 0 4px 0 #000; }
  .name::before, .name::after { content: attr(data-t); position: absolute; inset: 0; mix-blend-mode: screen; opacity: .8; text-shadow: none; }
  .name::before { color: #ff2a2a; transform: translate(-3px, 0); }
  .name::after { color: #25f4ee; transform: translate(3px, 0); }
  .hype.show .name::before { animation: g1 .9s steps(2) 2; }
  .hype.show .name::after { animation: g2 .9s steps(2) 2; }
  @keyframes g1 { 0% { clip-path: inset(10% 0 60% 0); transform: translate(-8px,0); } 50% { clip-path: inset(55% 0 10% 0); transform: translate(6px,0); } 100% { clip-path: none; transform: translate(-3px,0); } }
  @keyframes g2 { 0% { clip-path: inset(60% 0 5% 0); transform: translate(8px,0); } 50% { clip-path: inset(5% 0 70% 0); transform: translate(-6px,0); } 100% { clip-path: none; transform: translate(3px,0); } }
  .hype.big .name { font-size: 92px; }
  .msg { text-transform: none; font-weight: 500; font-size: 25px; color: #fff; opacity: .92; margin-top: 2px; max-width: 800px; margin-inline: auto;
         text-shadow: 0 2px 6px #000, 0 0 2px #000; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
  .msg:empty { display: none; }
  .gift { height: 76px; width: 76px; object-fit: contain; flex: none; filter: drop-shadow(0 0 14px rgba(145,70,255,.7)) drop-shadow(0 3px 6px rgba(0,0,0,.6)); }
  .gift:not([src]), .gift[src=""] { display: none; }
  .hype.big .gift { height: 88px; width: 88px; }
  .hype.show .gift { animation: spin .6s .1s cubic-bezier(.2,1.5,.4,1) both; }
  @keyframes spin { from { transform: scale(0) rotate(-120deg); } to { transform: none; } }
  .sparks { position: absolute; left: 50%; top: 55%; width: 0; height: 0; pointer-events: none; }
  .sparks i { position: absolute; width: 9px; height: 9px; border-radius: 2px; opacity: 0; animation: spark 1.2s ease-out forwards; }
  @keyframes spark { 0% { opacity: 1; transform: translate(0,0) rotate(0); } 100% { opacity: 0; transform: translate(var(--x), var(--y)) rotate(400deg); } }
</style></head>
<body>
<div class="wrap"><div class="hype" id="card"><div class="sparks" id="sparks"></div>
  <div class="top"><span class="pf" id="pf"></span><span class="label" id="label"></span><span class="chip" id="chip"></span></div>
  <div class="nrow"><img class="gift" id="gift" alt=""><div class="name" id="name"></div></div><div class="msg" id="msg"></div>
</div></div>
<script>
const q = new URLSearchParams(location.search);
const SECS = +(q.get("secs") || 6);
const ONLY = q.get("only"), SKIP = (q.get("skip") || "").split(",");
const WELCOME = q.get("welcome") !== "0";
const PF = { twitch: "#a970ff", youtube: "#ff4e45", tiktok: "#25f4ee" };
// Role colours match the badge colours in GreMi's Streamer.bot welcome alert.
const ROLE = { "lead mod": ["#006200", "Lead mod"], mod: ["#008000", "Mod"], partner: ["#6200c4", "Partner"],
               vip: ["#970097", "VIP"], prime: ["#006a9d", "Prime sub"], sub: ["#50009f", "Sub"], viewer: ["rgba(255,255,255,.16)", "Viewer"] };
const LEAD = ["ddrk0", "littleegend"];
const queue = []; let busy = false; const seen = new Set();
const $ = (id) => document.getElementById(id);

function push(a) {
  if (ONLY && a.platform !== ONLY) return;
  if (SKIP.includes(a.platform)) return;
  if (a.kind === "welcome" && !WELCOME) return;
  const key = a.platform + a.kind + a.name + (a.msg || "");
  if (seen.has(key) && a.kind !== "gift") return;   // Streamer.bot can send the same event twice
  seen.add(key); setTimeout(() => seen.delete(key), 15000);
  queue.push(a); next();
}
function next() {
  if (busy || !queue.length) return;
  busy = true;
  const a = queue.shift(), card = $("card");
  $("pf").style.background = PF[a.platform] || "#fff";
  $("label").textContent = a.label;
  const chip = $("chip");
  if (a.role) { chip.style.display = ""; chip.style.background = ROLE[a.role][0]; chip.textContent = ROLE[a.role][1]; }
  else if (a.chip) { chip.style.display = ""; chip.style.background = ""; chip.textContent = a.chip; }
  else chip.style.display = "none";
  const gift = $("gift"); if (a.img) gift.src = a.img; else gift.removeAttribute("src");
  const nm = $("name"); nm.textContent = a.name; nm.dataset.t = a.name; nm.style.fontSize = "";
  $("msg").textContent = a.msg || "";
  card.classList.toggle("big", !!a.big);
  // shrink long names so they fit the 900 px source
  const room = 860 - (a.img ? 104 : 0);
  if (nm.scrollWidth > room) nm.style.fontSize = Math.floor(parseFloat(getComputedStyle(nm).fontSize) * room / nm.scrollWidth) + "px";
  const sp = $("sparks"); sp.innerHTML = "";
  if (a.big) for (let i = 0; i < 28; i++) { const ang = i / 28 * Math.PI * 2, r = 200 + Math.random() * 180, el = document.createElement("i");
    el.style.cssText = `background:${["#e10600", "#9146ff", "#fff", PF[a.platform] || "#fff"][i % 4]};--x:${Math.cos(ang) * r}px;--y:${Math.sin(ang) * r * .45}px;animation-delay:${.15 + Math.random() * .15}s`;
    sp.appendChild(el); }
  card.classList.remove("show"); void card.offsetWidth;
  card.classList.add("show");
  setTimeout(() => { card.classList.remove("show"); setTimeout(() => { busy = false; next(); }, 600); }, (a.secs || SECS) * 1000);
}

// ---------- Streamer.bot ----------
const tierName = (t) => ({ 0: "Prime", prime: "Prime", 1: "Tier 1", 2: "Tier 2", 3: "Tier 3", tier1: "Tier 1", tier2: "Tier 2", tier3: "Tier 3", 1000: "Tier 1", 2000: "Tier 2", 3000: "Tier 3" }[String(t ?? "").toLowerCase()] || "");
function roleOf(u = {}, d = {}) {
  const login = String(u.login || u.name || d.user?.login || "").toLowerCase();
  if (LEAD.includes(login)) return "lead mod";
  const r = Number(u.role ?? d.message?.role ?? 0);         // Streamer.bot: 1 viewer, 2 VIP, 3 mod, 4 broadcaster
  const badges = (d.message?.badges || u.badges || []).map((b) => String(b.name || b).toLowerCase());
  if (r === 3 || u.moderator || badges.includes("moderator")) return "mod";
  if (badges.includes("partner")) return "partner";
  if (r === 2 || u.vip || badges.includes("vip")) return "vip";
  if (badges.includes("premium")) return "prime";
  if (u.subscribed || d.message?.subscriber || badges.includes("subscriber")) return "sub";
  return "viewer";
}
function onSB(ev, d) {
  const s = ev.source, t = ev.type;
  const who = (x) => x?.name || x?.display_name || x?.displayName || x?.login || x?.userName || "";
  const dn = who(d.user) || who(d.targetUser) || d.user_name || d.displayName || d.userName || d.user_login ||
    who((Object.entries(d).find(([k, v]) => k !== "broadcaster" && v && typeof v === "object" && who(v)) || [])[1]) || "";
  if (s === "Twitch") {
    if (t === "Follow") return push({ platform: "twitch", kind: "follow", label: "New follower", name: dn });
    if (t === "Sub") return push({ platform: "twitch", kind: "sub", label: "New sub", chip: tierName(d.subTier ?? d.sub_tier ?? d.tier), name: dn, msg: typeof d.message === "string" ? d.message : d.message?.text, big: true });
    if (t === "ReSub") return push({ platform: "twitch", kind: "sub", label: `Resub · ${d.cumulativeMonths || d.cumulative_months || d.cumulative || "?"} months`, chip: tierName(d.subTier ?? d.sub_tier ?? d.tier), name: dn, msg: typeof d.message === "string" ? d.message : d.text || d.message?.text, big: true });
    if (t === "GiftSub") return push({ platform: "twitch", kind: "gift", label: `Gifted a sub to ${d.recipientDisplayName || d.recipientUsername || who(d.recipient)}`, chip: tierName(d.subTier ?? d.sub_tier), name: d.isAnonymous ? "Anonymous" : dn });
    if (t === "GiftBomb") return push({ platform: "twitch", kind: "gift", label: `Gifted ${d.gifts ?? d.total ?? ""} subs`, chip: tierName(d.subTier ?? d.sub_tier), name: d.isAnonymous ? "Anonymous" : dn, big: true });
    if (t === "Raid") return push({ platform: "twitch", kind: "raid", label: `Raid · ${d.viewers ?? d.viewerCount ?? ""} viewers`, name: d.from_broadcaster_user_name || who(d.user) || d.from_broadcaster_user_login, big: true, secs: 10 });
    if (t === "Cheer") return push({ platform: "twitch", kind: "cheer", label: `Cheered ${d.bits ?? d.message?.bits ?? ""} bits`, name: d.displayName || d.message?.displayName || dn, msg: typeof d.message === "string" ? d.message : d.message?.message });
    if (t === "FirstWord") { const u = d.message || d.user || {}; return push({ platform: "twitch", kind: "welcome", label: "Welcome in the stream", role: roleOf({ ...u, login: u.username }, d), name: u.displayName || who(d.user), secs: 4 }); }
  }
  if (s === "YouTube") {
    if (t === "NewSubscriber") return push({ platform: "youtube", kind: "follow", label: "New subscriber", name: who(d.user) || d.userName });
    if (t === "SuperChat") return push({ platform: "youtube", kind: "superchat", label: "Super Chat", chip: d.amount, name: who(d.user) || d.userName, msg: d.message, big: true });
    if (t === "SuperSticker") return push({ platform: "youtube", kind: "superchat", label: "Super Sticker", chip: d.amount, name: who(d.user) || d.userName, big: true });
    if (t === "NewSponsor" || t === "MembershipGift") return push({ platform: "youtube", kind: "sub", label: t === "NewSponsor" ? "New member" : `Gifted ${d.count || ""} memberships`, chip: d.levelName || d.tier, name: who(d.user) || d.userName, big: true });
    if (t === "FirstWords") return push({ platform: "youtube", kind: "welcome", label: "Welcome in the stream", role: d.user?.isModerator ? "mod" : d.user?.isSponsor ? "sub" : "viewer", name: who(d.user), secs: 4 });
  }
}
function connectSB() {
  const ws = new WebSocket(`ws://${q.get("sb") || "127.0.0.1:8080"}/`);
  ws.onopen = () => ws.send(JSON.stringify({ request: "Subscribe", id: "gremi-alerts", events: {
    Twitch: ["Follow", "Sub", "ReSub", "GiftSub", "GiftBomb", "Raid", "Cheer", "FirstWord"],
    YouTube: ["NewSubscriber", "SuperChat", "SuperSticker", "NewSponsor", "MembershipGift", "FirstWords"] } }));
  ws.onmessage = (m) => { try { const j = JSON.parse(m.data); if (j.event) onSB(j.event, j.data || {}); } catch (e) { console.warn(e); } };
  ws.onclose = () => setTimeout(connectSB, 5000);
}

// ---------- TikFinity ----------
function connectTF() {
  const ws = new WebSocket(`ws://localhost:${q.get("tikfinity") || 21213}/`);
  ws.onmessage = (m) => {
    try {
      const j = JSON.parse(m.data), d = j.data || {}, name = d.nickname || d.uniqueId;
      if (j.event === "follow") push({ platform: "tiktok", kind: "follow", label: "New follower", name });
      if (j.event === "gift" && (d.giftType !== 1 || d.repeatEnd)) push({ platform: "tiktok", kind: "gift", label: `Sent ${d.repeatCount > 1 ? d.repeatCount + "× " : ""}${d.giftName || "a gift"}`, chip: d.diamondCount ? `${d.diamondCount * (d.repeatCount || 1)} coins` : "", img: d.giftPictureUrl, name, big: (d.diamondCount || 0) * (d.repeatCount || 1) >= 100 });
      if (j.event === "subscribe") push({ platform: "tiktok", kind: "sub", label: "New subscriber", name, big: true });
      if (j.event === "share") push({ platform: "tiktok", kind: "share", label: "Shared the stream", name, secs: 4 });
    } catch (e) { console.warn(e); }
  };
  ws.onclose = () => setTimeout(connectTF, 5000);
}

if (q.has("demo")) {
  // stand-in gift picture (live alerts use the picture TikFinity sends)
  const DEMO_GIFT = "data:image/svg+xml," + encodeURIComponent('<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64"><radialGradient id="g"><stop offset="0" stop-color="#fff"/><stop offset=".35" stop-color="#b48cff"/><stop offset="1" stop-color="#3a1c9c"/></radialGradient><circle cx="32" cy="32" r="28" fill="url(#g)"/><ellipse cx="32" cy="32" rx="30" ry="8" fill="none" stroke="#25f4ee" stroke-width="3" transform="rotate(-20 32 32)"/></svg>');
  const demo = [
    { platform: "twitch", kind: "welcome", label: "Welcome in the stream", role: "mod", name: "devildriver2396", secs: 3 },
    { platform: "twitch", kind: "follow", label: "New follower", name: "Lisa.SimRacing", secs: 3 },
    { platform: "twitch", kind: "sub", label: "Resub · 12 months", chip: "Tier 1", name: "0verfast", msg: "a year of watching GreMi brake too late", big: true, secs: 4 },
    { platform: "twitch", kind: "raid", label: "Raid · 23 viewers", name: "Bananensaus17", big: true, secs: 4 },
    { platform: "youtube", kind: "superchat", label: "Super Chat", chip: "€5.00", name: "DrewDrew Playz", msg: "P4 from P9, GG", big: true, secs: 4 },
    { platform: "tiktok", kind: "gift", label: "Sent 1× Galaxy", chip: "1000 coins", name: "markbonner189", img: DEMO_GIFT, big: true, secs: 4 },
  ];
  if (q.has("show")) { push({ ...demo[+q.get("show")], secs: 9999 }); } else {
  let i = 0; const loop = () => { push({ ...demo[i++ % demo.length], msg: demo[(i - 1) % demo.length].msg }); seen.clear(); setTimeout(loop, 5200); }; loop(); }
} else {
  if (ONLY !== "tiktok") connectSB();
  if (ONLY !== "twitch" && ONLY !== "youtube" && !SKIP.includes("tiktok")) connectTF();
}
</script>
</body></html>
