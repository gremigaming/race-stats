<!doctype html>
<!-- OBS browser source: race stats next to the race result, from the live league data.
     Cycles four pages: race awards, more awards (both for the other drivers), GreMi's race (with a position chart) and tonight's leaderboard.
     Source size 668x338 for the default 620x290 card (the card has a 24px margin).
     ?w=620 ?h=290 card size, ?every=12 seconds per page, ?page=awards|awards2|me|tonight, ?me=1 lets GreMi win awards too, shows one page,
     ?race=<file> show one race (testing). -->
<html><head><meta charset="utf-8"><title>Race stats</title>
<link rel="stylesheet" href="brand.css">
<style>
  .card { margin: 24px; display: flex; flex-direction: column; }
  .head { display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; }
  .dots { display: flex; gap: 6px; } .dots i { width: 22px; height: 4px; border-radius: 2px; background: rgba(255,255,255,.2); }
  .dots i.on { background: linear-gradient(90deg, #ff3b30, #b07bff); }
  .page { flex: 1; min-height: 0; animation: pin .5s ease both; }
  @keyframes pin { from { opacity: 0; transform: translateY(8px); } }
  .tiles { display: grid; grid-template-columns: repeat(3, 1fr); grid-template-rows: 1fr 1fr; gap: 10px; height: 100%; }
  .tile { background: rgba(0,0,0,.28); border-radius: 10px; padding: 10px 12px; min-width: 0; display: flex; flex-direction: column; justify-content: center; }
  .tile .label { font-size: 14px; }
  .v { font-weight: 800; font-size: 30px; line-height: 1.05; margin-top: 4px; font-variant-numeric: tabular-nums; white-space: nowrap; }
  .who { font-weight: 600; font-size: 19px; color: rgba(255,255,255,.85); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .who.me { color: #ff8fd0; }
  .sec { font-weight: 600; font-size: 18px; line-height: 1.25; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .sec b { color: #c58bff; font-weight: 800; margin-right: 6px; }
  .mine { display: grid; grid-template-columns: 210px 1fr; gap: 14px; height: 100%; }
  .bigpos { font-weight: 800; font-size: 46px; line-height: 1; white-space: nowrap; }
  .bigpos .up { color: #3ee08f; font-size: 28px; } .bigpos .down { color: #ff5a52; font-size: 28px; }
  .kv { display: flex; justify-content: space-between; font-weight: 600; font-size: 19px; line-height: 1.45; border-bottom: 1px solid rgba(255,255,255,.07); }
  .kv span:first-child { color: var(--dim); }
  svg { width: 100%; height: 100%; display: block; }
  .lb { display: flex; flex-direction: column; gap: 2px; }
  .lbr { display: grid; grid-template-columns: 34px 1fr auto auto; gap: 12px; align-items: center; font-weight: 600; font-size: 24px; padding: 2px 8px; border-radius: 6px; }
  .lbr.me { background: rgba(190,40,120,.32); box-shadow: inset 4px 0 0 #ff3b30; }
  .lbr .w { color: var(--dim); font-size: 17px; } .lbr .p { font-weight: 800; font-variant-numeric: tabular-nums; }
  .pips { display: flex; gap: 5px; margin-top: 10px; flex-wrap: wrap; }
  .pip { min-width: 32px; height: 21px; padding: 0 5px; border-radius: 4px; font: 800 15px/21px "Saira Condensed"; text-align: center; background: rgba(255,255,255,.14); }
  .pip.p1 { background: linear-gradient(90deg,#d4464a,#c4509f,#8a6cd0); } .pip.pod { background: rgba(197,139,255,.45); }
</style></head>
<body>
<div class="card fade out" id="card"><div class="streaks"><i></i><i></i><i></i><i></i></div>
  <div class="head"><div class="label" id="ttl">Race awards</div><div class="dots" id="dots"></div></div>
  <div class="page" id="page"></div>
</div>
<script type="module">
import { poll, races, loadSession, raceStats, classification, isMe, teamColor, fmtLap, fmtMs, shortName } from "./league.js";
const q = new URLSearchParams(location.search);
const card = document.getElementById("card");
card.style.width = (q.get("w") || 620) + "px";
card.style.height = (q.get("h") || 290) + "px";
const esc = (s) => String(s ?? "").replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const who = (n) => `<div class="who ${isMe(n) ? "me" : ""}">${esc(shortName(n))}</div>`;

// Awards go to the other drivers (GreMi has his own page): ?me=1 lets him win them too.
const others = (st) => st.rows.filter((r) => q.get("me") || !isMe(r.name));
const best = (list, score) => list.filter((r) => score(r) != null).sort((a, b) => score(a) - score(b) || a.pos - b.pos)[0] || null;
const tile = (label, v, sub) => `<div class="tile"><div class="label">${label}</div><div class="v">${v}</div>${sub}</div>`;
const plural = (n, w) => `${n} ${w}${n === 1 ? "" : "s"}`;

function awards(st) {
  const rs = others(st), fin = rs.filter((r) => !r.out), tiles = [];
  const fl = best(rs, (r) => r.best ? toMs(r.best) : null);
  if (fl) tiles.push(tile("Fastest lap", `<span style="color:${fl.name === st.fastest?.name ? "#c58bff" : "#fff"}">${esc(fmtLap(fl.best))}</span>`, who(fl.name)));
  const ts = best(rs, (r) => st.trapOf(r.name) ? -st.trapOf(r.name) : null);
  if (ts) tiles.push(tile("Top speed", `${Math.round(st.trapOf(ts.name))}<small style="font-size:18px"> km/h</small>`, who(ts.name)));
  const ok = best(rs, (r) => r.made ? -r.made : null);
  if (ok) tiles.push(tile("Overtake king", plural(ok.made, "pass").replace("passs", "passes"), who(ok.name)));
  const cl = best(rs, (r) => r.gained > 0 ? -r.gained : null);
  tiles.push(tile("Biggest climber", cl ? `P${cl.grid} → P${cl.pos}` : "—", cl ? who(cl.name) : `<div class="who">nobody gained</div>`));
  // Cleanest: the finisher with the fewest contacts and penalties, then fewest track limit warnings, best placed.
  const cn = best(fin, (r) => (r.contacts + r.pens) * 100 + r.warns);
  if (cn) tiles.push(tile("Cleanest driver", cn.contacts ? plural(cn.contacts, "contact") : cn.pens ? plural(cn.pens, "penalty").replace("penaltys", "penalties") : cn.warns ? plural(cn.warns, "warning") : "Spotless", who(cn.name)));
  const l1 = best(rs, (r) => r.lap1 > 0 ? -r.lap1 : null);
  if (l1) tiles.push(tile("Lap 1 hero", `+${plural(l1.lap1, "place")}`, who(l1.name)));
  return `<div class="tiles">${tiles.slice(0, 6).join("")}</div>`;
}

function awards2(st) {
  const rs = others(st), fin = rs.filter((r) => !r.out), tiles = [];
  const mine = (s) => q.get("me") || !isMe(s?.name);
  if (st.sectors.some(Boolean))
    tiles.push(`<div class="tile"><div class="label">Purple sectors</div>${st.sectors.map((s, i) => s ? `<div class="sec"><b>S${i + 1}</b>${mine(s) ? esc(shortName(s.name)) : "GreMi"}</div>` : "").join("")}</div>`);
  const co = best(fin, (r) => r.spread);
  if (co) tiles.push(tile("Most consistent", `±${co.spread.toFixed(2)}<small style="font-size:18px"> s</small>`, who(co.name)));
  const tw = best(fin, (r) => r.wear);
  if (tw) tiles.push(tile("Tyre whisperer", `${tw.wear.toFixed(1)}%<small style="font-size:18px"> /lap</small>`, who(tw.name)));
  const ll = best(fin, (r) => r.lastLap || null);
  if (ll) tiles.push(tile("Fastest last lap", esc(fmtMs(ll.lastLap)), who(ll.name)));
  // Hardest to pass: a finisher nobody (or the fewest) got past, best placed.
  const hp = best(fin.filter((r) => r.pos > 1), (r) => r.lost);
  if (hp) tiles.push(tile("Hardest to pass", hp.lost ? `passed only ${hp.lost}x` : "Never passed", who(hp.name)));
  tiles.push(tile("Race control", plural(st.contacts.length, "contact"), `<div class="who">${st.overtakes} passes · ${plural(st.pens, "penalty").replace("penaltys", "penalties")}</div>`));
  return `<div class="tiles">${tiles.slice(0, 6).join("")}</div>`;
}

function chart(st, me) {
  const W = 360, H = 200, n = st.rows.length || 10;
  const maxLap = Math.max(1, ...st.hist.flatMap((h) => h.pts.map((p) => p[0])));
  const x = (l) => 26 + (l / maxLap) * (W - 36), y = (p) => 10 + ((p - 1) / Math.max(1, n - 1)) * (H - 20);
  const line = (h) => h.pts.map((p, i) => `${i ? "L" : "M"}${x(p[0]).toFixed(1)},${y(p[1]).toFixed(1)}`).join("");
  const others = st.hist.filter((h) => h.name !== me.name).map((h) => `<path d="${line(h)}" fill="none" stroke="${teamColor(h.team)}" stroke-opacity=".35" stroke-width="2"/>`).join("");
  const mine = st.hist.find((h) => h.name === me.name);
  const end = mine?.pts.at(-1);
  return `<svg viewBox="0 0 ${W} ${H}" preserveAspectRatio="none"><defs><linearGradient id="g" gradientUnits="userSpaceOnUse" x1="0" y1="0" x2="${W}" y2="0"><stop offset="0" stop-color="#ff3b30"/><stop offset="1" stop-color="#b07bff"/></linearGradient></defs>
    ${[1, n].map((p) => `<text x="0" y="${y(p) + 4}" fill="rgba(255,255,255,.45)" font-size="11" font-family="Saira Condensed">P${p}</text>`).join("")}
    ${others}${mine ? `<path d="${line(mine)}" fill="none" stroke="url(#g)" stroke-width="5" stroke-linejoin="round" stroke-linecap="round"/>
    <circle cx="${x(end[0])}" cy="${y(end[1])}" r="6" fill="#fff"/>` : ""}</svg>`;
}

function mine(st) {
  const me = st.rows.find((r) => isMe(r.name));
  if (!me) return null;
  const g = me.gained;
  const arrow = g > 0 ? `<span class="up">▲${g}</span>` : g < 0 ? `<span class="down">▼${-g}</span>` : "";
  const gapFl = st.fastest && me.best ? ((toMs(me.best) - st.fastest.ms) / 1000) : null;
  const kv = (k, v) => `<div class="kv"><span>${k}</span><span>${v}</span></div>`;
  return `<div class="mine"><div>
      <div class="bigpos">${me.grid ? `P${me.grid} → ` : ""}P${me.pos} ${arrow}</div>
      <div style="margin-top:10px">
        ${kv("Overtakes", `${st.made(me.name)} made · ${st.lost(me.name)} lost`)}
        ${kv("Best lap", `${esc(fmtLap(me.best))}${gapFl > 0 ? ` <span style="color:var(--dim)">+${gapFl.toFixed(3)}</span>` : gapFl === 0 ? " ◆" : ""}`)}
        ${kv("Top speed", st.trapOf(me.name) ? `${Math.round(st.trapOf(me.name))} km/h` : "—")}
        ${kv("Contacts", st.contactsOf(me.name) + (me.pen ? ` · +${me.pen}s pen` : ""))}
      </div></div>
    <div>${chart(st, me)}</div></div>`;
}
const toMs = (s) => { const p = String(s).split(":"); return Math.round((p.length > 1 ? +p[0] * 60 + +p[1] : +p[0]) * 1000); };

async function tonight(src, all) {
  const night = all[0].night;
  const list = all.filter((r) => r.night === night).reverse();
  const pts = new Map(), wins = new Map(), mine = [];
  for (const r of list) {
    try {
      for (const c of classification(await loadSession(src, r.file))) {
        pts.set(c.name, (pts.get(c.name) || 0) + (c.points || 0));
        if (c.pos === 1) wins.set(c.name, (wins.get(c.name) || 0) + 1);
        if (isMe(c.name)) mine.push(c.pos);
      }
    } catch { /* skip a missing file */ }
  }
  const board = [...pts].sort((a, b) => b[1] - a[1]).map(([name, p], i) => ({ name, p, i: i + 1 }));
  let show = board.slice(0, 4);
  const me = board.find((b) => isMe(b.name));
  if (me && !show.includes(me)) show = [...board.slice(0, 3), me];
  return `<div class="lb">${show.map((b) => `<div class="lbr ${isMe(b.name) ? "me" : ""}"><span class="p">${b.i}</span><span>${esc(shortName(b.name))}</span>
      <span class="w">${wins.get(b.name) ? `${wins.get(b.name)} win${wins.get(b.name) > 1 ? "s" : ""}` : ""}</span><span class="p">${b.p} pts</span></div>`).join("")}</div>
    <div class="pips">${mine.slice(-12).map((p) => `<span class="pip ${p === 1 ? "p1" : p <= 3 ? "pod" : ""}">P${p}</span>`).join("")}</div>`;
}

let pages = [], at = 0, timer = 0;
const titles = { awards: "Race awards", awards2: "More awards", me: "GreMi's race", tonight: "Tonight's leaderboard" };
function show() {
  if (!pages.length) return;
  const p = pages[at % pages.length];
  document.getElementById("ttl").textContent = p.title;
  document.getElementById("dots").innerHTML = pages.length > 1 ? pages.map((_, i) => `<i class="${i === at % pages.length ? "on" : ""}"></i>`).join("") : "";
  const el = document.getElementById("page");
  el.style.animation = "none"; void el.offsetWidth; el.style.animation = "";
  el.innerHTML = p.html;
}

poll(async (src) => {
  const all = races(src.index);
  const last = all.find((r) => r.file === q.get("race")) || all[0];
  if (!last) return;
  const st = raceStats(await loadSession(src, last.file));
  const next = [{ key: "awards", html: awards(st) }, { key: "awards2", html: awards2(st) }];
  const m = mine(st);
  if (m) next.push({ key: "me", html: m });
  next.push({ key: "tonight", html: await tonight(src, all) });
  pages = next.filter((p) => !q.get("page") || p.key === q.get("page")).map((p) => ({ ...p, title: titles[p.key] }));
  at = 0; show();
  clearInterval(timer);
  timer = setInterval(() => { at++; show(); }, +(q.get("every") || 12) * 1000);
  card.classList.remove("out");
  card.classList.remove("sweep"); void card.offsetWidth; card.classList.add("sweep");
});
</script>
</body></html>
