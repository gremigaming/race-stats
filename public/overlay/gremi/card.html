<!doctype html>
<!-- OBS browser source: ONE compact card with the weekly giveaway (top) and followers / watching now (bottom).
     Replaces the separate Race Control /giveaway and /socials cards on the horizontal scenes.
     Size 440 x 170 (card 400 x ~128 at 20,10; room for the shadow). Data: Race Control giveaway.json + socials.json (CORS *),
     TikTok live viewers from TikFinity (ws://localhost:21213).
     ?server=https://104-154-182-45.sslip.io  ?every=30 seconds between followers and watching now  ?tikfinity=21213  ?demo -->
<html><head><meta charset="utf-8"><title>GreMi card</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Saira+Condensed:wght@600;800&display=swap">
<style>
  :root { --red: #e10600; --purple: #9146ff; --ink: #fff; --dim: rgba(255,255,255,.62);
          --neon: linear-gradient(90deg, #d4464a, #c4509f, #8a6cd0); }
  html, body { margin: 0; background: transparent; overflow: hidden; }
  body { font-family: "Saira Condensed", "Arial Narrow", sans-serif; color: var(--ink); }
  .card { position: relative; width: 400px; margin: 10px 20px 30px; padding: 10px 16px; border-radius: 14px; box-sizing: border-box;
          background: linear-gradient(90deg, #460612 0%, #280a5a 100%); box-shadow: 0 5px 18px rgba(0,0,0,.45); isolation: isolate; }
  .streaks { position: absolute; inset: 0; border-radius: 14px; overflow: hidden; z-index: -1; }
  .streaks i { position: absolute; top: -20px; bottom: -20px; transform: skewX(-31deg); filter: blur(4px); }
  .streaks i:nth-child(1) { left: -30px; width: 40px; background: rgba(225,6,0,.3); }
  .streaks i:nth-child(2) { left: 58%; width: 60px; background: rgba(145,70,255,.26); }
  .streaks i:nth-child(3) { left: 84%; width: 18px; background: rgba(255,255,255,.1); }
  .streaks i:nth-child(4) { left: -60%; width: 60px; background: rgba(255,255,255,.22); filter: blur(8px); opacity: 0; }
  .card.win .streaks i:nth-child(4) { animation: sweep 2.4s ease-in-out infinite; }
  .card::before { content: ""; position: absolute; inset: 0; border-radius: 14px; padding: 2px; background: linear-gradient(90deg, var(--red), var(--purple));
          -webkit-mask: linear-gradient(#000 0 0) content-box, linear-gradient(#000 0 0); -webkit-mask-composite: xor; mask-composite: exclude; }
  .row { position: relative; display: flex; align-items: center; gap: 12px; height: 50px; }
  .sep { height: 1px; margin: 4px 0; background: linear-gradient(90deg, rgba(255,255,255,.04), rgba(255,255,255,.22), rgba(255,255,255,.04)); }
  .ico { position: relative; width: 36px; height: 36px; flex: none; display: flex; align-items: center; justify-content: center;
         font-size: 30px; line-height: 1; filter: drop-shadow(0 0 8px rgba(145,70,255,.6)); }
  .ico svg { position: absolute; inset: 2px; width: 32px; height: 32px; transition: opacity .35s, transform .35s; }
  .ico .off { opacity: 0; transform: scale(.6) rotate(-12deg); }
  .main { flex: 1; min-width: 0; }
  .label { display: flex; align-items: center; gap: 6px; white-space: nowrap; font-weight: 600; font-size: 13px; letter-spacing: .13em;
           color: var(--dim); text-transform: uppercase; line-height: 1; }
  .label b { color: var(--ink); font-weight: 600; }
  .big { font-weight: 800; font-size: 27px; line-height: 1.05; text-transform: uppercase; letter-spacing: .02em; white-space: nowrap; transform-origin: left center; }
  .side { display: flex; flex-direction: column; align-items: flex-end; gap: 7px; flex: none; }
  .pips { display: flex; gap: 4px; }
  .pip { width: 18px; height: 6px; border-radius: 3px; background: rgba(255,255,255,.16); transition: background .4s; }
  .pip.on, .bar b { background: var(--neon); box-shadow: -3px 0 8px rgba(212,70,74,.55), 3px 0 8px rgba(138,108,208,.6); }
  .bar { width: 110px; height: 6px; border-radius: 3px; background: rgba(255,255,255,.16); display: none; }
  .bar b { display: block; height: 100%; width: 100%; border-radius: 3px; transition: width 1s linear; }
  .who { display: flex; align-items: center; gap: 5px; white-space: nowrap; font-weight: 600; font-size: 13px; letter-spacing: .06em; color: var(--dim); text-transform: uppercase; line-height: 1; }
  .who svg { width: 15px; height: 15px; fill: #5865f2; }
  .nums { display: flex; gap: 14px; margin-top: 4px; transition: opacity .35s, transform .35s; }
  .nums.out { opacity: 0; transform: translateY(6px); }
  .n { position: relative; display: flex; align-items: center; gap: 5px; }
  .n svg { width: 15px; height: 15px; fill: #fff; opacity: .92; flex: none; }
  .n span { font-weight: 800; font-size: 23px; line-height: 1; font-variant-numeric: tabular-nums; white-space: nowrap; }
  .dot { width: 7px; height: 7px; border-radius: 50%; background: #ff3b30; box-shadow: 0 0 6px #ff3b30; display: none; animation: live 1.4s ease-in-out infinite; }
  .viewers .dot { display: block; }
  .plus { position: absolute; left: 50%; top: -4px; transform: translateX(-50%); font-weight: 800; font-size: 17px; white-space: nowrap; color: #fff;
          text-shadow: 0 0 10px var(--purple), 2px 2px 0 #000; opacity: 0; pointer-events: none; }
  .plus.go { animation: plus 1.6s ease-out; }
  .card.bump { animation: bump .7s ease; }
  .ico.sub { animation: giftsub 1.1s ease; } .ico.drawing { animation: wobble .5s ease-in-out infinite; }
  .ico .beat { animation: beat 1.1s ease; } .n span.tick, .big.tick { animation: tick .5s ease; }
  .pip.new { animation: pipflash 1.2s ease; } .card.win { animation: glow 2s ease-in-out infinite; }
  @keyframes bump { 30% { transform: scale(1.04); } 60% { transform: scale(.99); } }
  @keyframes giftsub { 15% { transform: scale(1.35) translateY(-8px) rotate(-14deg); } 30% { transform: scale(1.35) translateY(-8px) rotate(14deg); } 60% { transform: scale(1.15) rotate(6deg); } }
  @keyframes wobble { 0%, 100% { transform: rotate(-10deg) scale(1.05); } 50% { transform: rotate(10deg) scale(1.1); } }
  @keyframes beat { 15% { transform: scale(1.25); } 30% { transform: scale(1); } 45% { transform: scale(1.18); } 60% { transform: scale(1); } }
  @keyframes plus { 0% { opacity: 0; transform: translate(-50%, 24px) scale(.6); } 20% { opacity: 1; transform: translate(-50%, 0) scale(1.1); } 70% { opacity: 1; } 100% { opacity: 0; transform: translate(-50%, -10px); } }
  @keyframes tick { 30% { transform: scale(1.12); color: #ffd1ec; } }
  @keyframes pipflash { 0%, 50% { background: #fff; box-shadow: 0 0 14px #fff; } }
  @keyframes glow { 50% { box-shadow: 0 5px 18px rgba(0,0,0,.45), 0 0 24px rgba(145,70,255,.75); } }
  @keyframes live { 50% { opacity: .35; box-shadow: none; } }
  @keyframes sweep { 0% { left: -60%; opacity: 0; } 20% { opacity: 1; } 60%, 100% { left: 130%; opacity: 0; } }
</style></head>
<body>
<div class="card" id="card">
  <div class="streaks"><i></i><i></i><i></i><i></i></div>
  <div class="row">
    <div class="ico" id="gift"><span id="gicon">🎁</span><div class="plus" id="gplus">+1 SUB</div></div>
    <div class="main"><div class="label" id="glabel">Giveaway · €10 gift card</div><div class="big" id="gbig">…</div></div>
    <div class="side"><div class="pips" id="pips"></div><div class="bar" id="bar"><b id="fill"></b></div><div class="who" id="who"></div></div>
  </div>
  <div class="sep"></div>
  <div class="row" id="srow">
    <div class="ico" id="sico">
      <svg id="heart" viewBox="0 0 24 24"><defs><linearGradient id="g1" x1="0" x2="1"><stop offset="0" stop-color="#ff4d57"/><stop offset=".5" stop-color="#e05bb5"/><stop offset="1" stop-color="#9a7cff"/></linearGradient></defs><path fill="url(#g1)" d="M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z"/></svg>
      <svg id="eye" class="off" viewBox="0 0 24 24"><path fill="url(#g1)" d="M12 4.5C7 4.5 2.73 7.61 1 12c1.73 4.39 6 7.5 11 7.5s9.27-3.11 11-7.5c-1.73-4.39-6-7.5-11-7.5zM12 17a5 5 0 1 1 0-10 5 5 0 0 1 0 10zm0-8a3 3 0 1 0 0 6 3 3 0 0 0 0-6z"/></svg>
    </div>
    <div class="main"><div class="label"><i class="dot"></i><span id="slabel">Followers</span></div><div class="nums" id="nums"></div></div>
  </div>
</div>
<script>
const q = new URLSearchParams(location.search);
const SERVER = (q.get("server") || "https://104-154-182-45.sslip.io").replace(/\/$/, "");
const EVERY = Math.max(5, +q.get("every") || 30) * 1000;
const $ = (id) => document.getElementById(id);
const restart = (el, cls) => { el.classList.remove(cls); void el.offsetWidth; el.classList.add(cls); };
const fmt = (n) => Math.round(n).toLocaleString("en-US");
const mmss = (s) => { s = Math.max(0, Math.ceil(s)); return Math.floor(s / 60) + ":" + String(s % 60).padStart(2, "0"); };
const fitText = (el, max, min) => { let s = max; el.style.fontSize = s + "px"; while (el.scrollWidth > el.clientWidth + 1 && s > min) { s -= 1; el.style.fontSize = s + "px"; } };
const LOGO = {
  twitch: '<svg viewBox="0 0 24 24"><path d="M11.571 4.714h1.715v5.143H11.57zm4.715 0H18v5.143h-1.714zM6 0L1.714 4.286v15.428h5.143V24l4.286-4.286h3.428L22.286 12V0zm14.571 11.143l-3.428 3.428h-3.429l-3 3v-3H6.857V1.714h13.714Z"/></svg>',
  youtube: '<svg viewBox="0 0 24 24"><path d="M23.498 6.186a3.016 3.016 0 0 0-2.122-2.136C19.505 3.545 12 3.545 12 3.545s-7.505 0-9.377.505A3.017 3.017 0 0 0 .502 6.186C0 8.07 0 12 0 12s0 3.93.502 5.814a3.016 3.016 0 0 0 2.122 2.136c1.871.505 9.376.505 9.376.505s7.505 0 9.377-.505a3.015 3.015 0 0 0 2.122-2.136C24 15.93 24 12 24 12s0-3.93-.502-5.814zM9.545 15.568V8.432L15.818 12l-6.273 3.568z"/></svg>',
  tiktok: '<svg viewBox="0 0 24 24"><path d="M12.525.02c1.31-.02 2.61-.01 3.91-.02.08 1.53.63 3.09 1.75 4.17 1.12 1.11 2.7 1.62 4.24 1.79v4.03c-1.44-.05-2.89-.35-4.2-.97-.57-.26-1.1-.59-1.62-.93-.01 2.92.01 5.84-.02 8.75-.08 1.4-.54 2.79-1.35 3.94-1.31 1.92-3.58 3.17-5.91 3.21-1.43.08-2.86-.31-4.08-1.03-2.02-1.19-3.44-3.37-3.65-5.71-.02-.5-.03-1-.01-1.49.18-1.9 1.12-3.72 2.58-4.96 1.66-1.44 3.98-2.13 6.15-1.72.02 1.48-.04 2.96-.04 4.44-.99-.32-2.15-.23-3.02.37-.63.41-1.11 1.04-1.36 1.75-.21.51-.15 1.07-.14 1.61.24 1.64 1.82 3.02 3.5 2.87 1.12-.01 2.19-.66 2.77-1.61.19-.33.4-.67.41-1.06.1-1.79.06-3.57.07-5.36.01-4.03-.01-8.05.02-12.07z"/></svg>',
};
const DISCORD = '<svg viewBox="0 0 24 24"><path d="M20.3 4.4A19.8 19.8 0 0 0 15.4 2.9l-.6 1.3a18.3 18.3 0 0 0-5.5 0l-.6-1.3a19.7 19.7 0 0 0-4.9 1.5C.5 9-.3 13.6.1 18.1a19.9 19.9 0 0 0 6 3l1.3-2a12.8 12.8 0 0 1-1.9-.9l.4-.3a14.2 14.2 0 0 0 12.1 0l.4.3c-.6.4-1.2.7-1.9.9l1.3 2a19.8 19.8 0 0 0 6-3c.5-5.2-.8-9.7-3.5-13.7zM8 15.3c-1.2 0-2.2-1.1-2.2-2.4s1-2.4 2.2-2.4 2.2 1.1 2.2 2.4-1 2.4-2.2 2.4zm8 0c-1.2 0-2.2-1.1-2.2-2.4s1-2.4 2.2-2.4 2.2 1.1 2.2 2.4-1 2.4-2.2 2.4z"/></svg>';

// ---------- giveaway ----------
const WIN_SHOW = 300, SUSPENSE = 3000;
let gv = null, offset = 0, revealAt = 0, lastTick = null;
function showGiveaway() {
  if (!gv || !gv.status) return;
  const now = Date.now() / 1000 + offset, suspense = Date.now() < revealAt;
  const winner = !suspense && gv.winner && now - gv.won_at < WIN_SHOW;
  let label = "Giveaway · €10 gift card", big, timer = false, drawing = false, who = "";
  if (gv.status === "open") big = gv.left === 1 ? "1 sub to go" : gv.left + " subs to go";
  else if (gv.status === "drawing") {
    const left = gv.draw_at - now; label = "Giveaway draw"; big = left > 0 ? "Draw in " + mmss(left) : "Drawing…"; drawing = left <= 0; timer = true;
    const sec = Math.ceil(left); if (left > 0 && sec <= 10 && sec !== lastTick) { lastTick = sec; restart($("gbig"), "tick"); }
    $("fill").style.width = Math.max(0, Math.min(100, 100 * left / (gv.delay || 600))) + "%";
  } else if (suspense) { label = "Giveaway draw"; big = "Drawing…"; drawing = true; }
  else if (winner) { label = "Giveaway winner"; big = gv.winner; who = "GG!"; }
  else { label = "Giveaway"; big = "Next one tomorrow"; if (gv.winner) who = "Last: " + gv.winner; }
  $("glabel").textContent = label; $("gbig").textContent = big; fitText($("gbig"), 27, 16);
  $("who").innerHTML = gv.status !== "closed" ? DISCORD + "<span></span>" : "<span></span>";
  $("who").lastChild.textContent = gv.status !== "closed" ? (gv.entered || 0) + " entered" : who;
  const icon = winner ? "🏆" : "🎁"; if ($("gicon").textContent !== icon) $("gicon").textContent = icon;
  $("gift").classList.toggle("drawing", drawing); $("card").classList.toggle("win", !!winner);
  $("pips").style.display = timer || gv.status === "closed" ? "none" : "flex"; $("bar").style.display = timer ? "block" : "none";
  const pips = $("pips");
  if (pips.children.length !== gv.need) { pips.innerHTML = ""; for (let i = 0; i < gv.need; i++) { const p = document.createElement("div"); p.className = "pip"; pips.appendChild(p); } }
  [...pips.children].forEach((p, i) => p.classList.toggle("on", gv.status !== "open" || i < gv.subs));
}
function updateGiveaway(d) {
  offset = d.now - Date.now() / 1000;
  const prev = gv; gv = d; showGiveaway();
  if (!prev) return;
  if (d.round === prev.round && (d.subs > prev.subs || (prev.status === "open" && d.status === "drawing"))) {
    restart($("card"), "bump"); restart($("gift"), "sub"); restart($("gplus"), "go");
    const pip = $("pips").children[Math.min(d.subs, d.need) - 1]; if (pip) restart(pip, "new");
  } else if (prev.status === "drawing" && d.status === "closed" && d.winner) {
    revealAt = Date.now() + SUSPENSE; showGiveaway(); setTimeout(() => { showGiveaway(); restart($("card"), "bump"); }, SUSPENSE);
  }
}

// ---------- followers / watching now ----------
const ORDER = ["twitch", "youtube", "tiktok"];
let soc = null, server = null, tiktok = null, page = "followers", shown = {}, drawn = "";
const live = () => soc && Object.keys(soc.viewers || {}).length > 0;
function countTo(el, from, to) {
  el.textContent = fmt(to);
  const t0 = performance.now();
  const step = (t) => { const k = Math.max(0, Math.min(1, (t - t0) / 900)), e = 1 - Math.pow(1 - k, 3); el.textContent = fmt(from + (to - from) * e); if (k < 1) requestAnimationFrame(step); };
  requestAnimationFrame(step);
}
function drawSocials(animate) {
  if (!soc) return;
  const nums = soc[page] || {}, keys = ORDER.filter((k) => nums[k] !== undefined), sig = page + ":" + keys.join(",");
  if (sig !== drawn) { drawn = sig; shown = {}; $("nums").innerHTML = keys.map((k) => `<div class="n" data-k="${k}"><div class="plus">+1</div>${LOGO[k]}<span>0</span></div>`).join(""); }
  const total = keys.reduce((s, k) => s + nums[k], 0);
  $("slabel").innerHTML = page === "viewers" ? "Watching now · <b>" + fmt(total) + "</b>" : "Followers · <b>" + fmt(total) + "</b>";
  document.body.classList.toggle("viewers", page === "viewers");
  for (const k of keys) {
    const el = $("nums").querySelector(`[data-k="${k}"]`), span = el.querySelector("span"), v = nums[k];
    if (shown[k] === undefined) countTo(span, 0, v);
    else if (shown[k] !== v) {
      countTo(span, shown[k], v); restart(span, "tick");
      if (page === "followers" && v > shown[k] && animate) { const p = el.querySelector(".plus"); p.textContent = "+" + (v - shown[k]); restart(p, "go"); restart($("card"), "bump"); restart($("heart"), "beat"); }
    }
    shown[k] = v;
  }
}
function setPage(next) {
  if (next === page) return;
  $("nums").classList.add("out");
  setTimeout(() => { page = next; drawn = ""; $("heart").classList.toggle("off", page !== "followers"); $("eye").classList.toggle("off", page !== "viewers"); drawSocials(false); $("nums").classList.remove("out"); }, 350);
}
function updateSocials(d) {
  server = d; d = Object.assign({}, d, { viewers: Object.assign({}, d.viewers || {}) });
  if (tiktok && Date.now() - tiktok.at < 120000) d.viewers.tiktok = tiktok.count;
  soc = d; if (page === "viewers" && !live()) setPage("followers"); drawSocials(true);
}
function tikfinity() {
  let ws; try { ws = new WebSocket("ws://localhost:" + (q.get("tikfinity") || 21213)); } catch (e) { return setTimeout(tikfinity, 10000); }
  ws.onmessage = (m) => { let msg; try { msg = JSON.parse(m.data); } catch (e) { return; }
    const ev = msg.event || msg.type || "", d = msg.data || msg;
    if (/streamEnd|liveEnd/i.test(ev)) { tiktok = null; return server && updateSocials(server); }
    const n = d.viewerCount ?? d.viewer_count ?? d.roomUserCount; if (typeof n === "number") { tiktok = { count: n, at: Date.now() }; if (server) updateSocials(server); } };
  ws.onclose = () => setTimeout(tikfinity, 10000);
}
const getJSON = async (f) => (await fetch(SERVER + "/" + f, { cache: "no-store" })).json();

if (q.has("demo")) {
  updateGiveaway({ status: "open", round: 2, need: 5, subs: 2, left: 3, entered: 6, now: Date.now() / 1000 });
  updateSocials({ followers: { twitch: 1685, youtube: 2710, tiktok: 4193 }, viewers: { twitch: 41, youtube: 18, tiktok: 63 } });
  setTimeout(() => updateGiveaway({ status: "open", round: 2, need: 5, subs: 3, left: 2, entered: 7, now: Date.now() / 1000 }), 3000);
  setInterval(() => setPage(page === "followers" ? "viewers" : "followers"), 8000);
} else {
  const pg = async () => { try { updateGiveaway(await getJSON("giveaway.json")); } catch (e) {} };
  const ps = async () => { try { updateSocials(await getJSON("socials.json")); } catch (e) {} };
  pg(); ps(); setInterval(pg, 3000); setInterval(ps, 10000); tikfinity();
  setInterval(() => setPage(page === "followers" && live() ? "viewers" : "followers"), EVERY);
}
setInterval(showGiveaway, 250);
</script>
</body></html>
