name: Recorder check

# Compiles uploader/TelemetryRecorder.cs the way RaceUploader.ps1 does (Windows
# PowerShell 5.1 Add-Type), feeds it a made-up session and reads the file back.
on:
  push:
    branches: [main]
    paths:
      - uploader/TelemetryRecorder.cs
      - uploader/RaceUploader.ps1
      - scripts/telemetry/gmtel.py
      - scripts/telemetry/test_recorder.py
      - uploader/ClassificationCapture.ps1
      - scripts/telemetry/classification_ocr.py
      - scripts/telemetry/test_classification_ocr.py
      - .github/workflows/recorder-check.yml
  workflow_dispatch:

jobs:
  check:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Record a made-up session
        shell: powershell
        run: |
          Add-Type -Path uploader/TelemetryRecorder.cs
          $out = Join-Path $env:RUNNER_TEMP "telemetry"
          $recorder = New-Object GmTelemetryRecorder -ArgumentList $out, 20778
          $recorder.Start()
          Start-Sleep -Seconds 1
          python scripts/telemetry/test_recorder.py send 20778
          if ($LASTEXITCODE -ne 0) { exit 1 }
          $recorder.Stop()
          Write-Host "Recorder status: $($recorder.Status), saved: $($recorder.LastSaved)"
          python scripts/telemetry/test_recorder.py check $out
          if ($LASTEXITCODE -ne 0) { exit 1 }
      # The classification screen: a made-up screen read by Windows' OCR, encrypted,
      # then decrypted and tied to the made-up results by classification_ocr.py
      - name: Read a made-up classification screen
        shell: powershell
        run: |
          python -m pip install --quiet --disable-pip-version-check pillow cryptography 2>&1 | Out-Null
          python scripts/telemetry/test_classification_ocr.py
          if ($LASTEXITCODE -ne 0) { exit 1 }
          $dir = Join-Path $env:RUNNER_TEMP "classification"
          python scripts/telemetry/test_classification_ocr.py render $dir
          if ($LASTEXITCODE -ne 0) { exit 1 }
          $p = Get-Content (Join-Path $dir "packets.json") -Raw | ConvertFrom-Json
          & powershell -NoProfile -ExecutionPolicy Bypass -File uploader/ClassificationCapture.ps1 `
            -OutFile (Join-Path $dir "out\test.gmcls") -Results $p.results -Participants $p.participants `
            -Recording "test" -ImagePath (Join-Path $dir "screen.png") -KeepDir (Join-Path $dir "keep") `
            -PublicKeyXml (Get-Content (Join-Path $dir "public.xml") -Raw)
          if ($LASTEXITCODE -ne 0) { exit 1 }
          python scripts/telemetry/test_classification_ocr.py check $dir
          if ($LASTEXITCODE -ne 0) { exit 1 }
          # the live standings tower after GreMi's finish: anchored on lap data, no results yet
          $t = Get-Content (Join-Path $dir "tower.json") -Raw | ConvertFrom-Json
          & powershell -NoProfile -ExecutionPolicy Bypass -File uploader/ClassificationCapture.ps1 `
            -OutFile (Join-Path $dir "out-tower\test.gmcls") -FinishLap $t.finish_lap -FinishTime 1234.5 -Participants $t.participants `
            -Recording "test" -ImagePath (Join-Path $dir "tower.png") `
            -PublicKeyXml (Get-Content (Join-Path $dir "public.xml") -Raw)
          if ($LASTEXITCODE -ne 0) { exit 1 }
          python scripts/telemetry/test_classification_ocr.py check-tower $dir
          if ($LASTEXITCODE -ne 0) { exit 1 }
      # The live uplink: the same made-up session through GmLiveUplink into the live
      # race server (gremigaming/race-control-stats live/), which must store it
      - uses: actions/checkout@v4
        with:
          repository: gremigaming/race-control-stats
          path: race-control-stats
      - name: Send a made-up session to the live server
        shell: powershell
        run: |
          python -m pip install --quiet --disable-pip-version-check "websockets>=13,<16" 2>&1 | Out-Null
          $env:INGEST_TOKEN = "test-token"
          $env:DATA_DIR = Join-Path $env:RUNNER_TEMP "live"
          $env:PORT = "8100"
          $server = Start-Process python -ArgumentList "-m", "live.server" -WorkingDirectory race-control-stats -PassThru -NoNewWindow
          Start-Sleep -Seconds 4
          Add-Type -Path uploader/TelemetryRecorder.cs
          $recorder = New-Object GmTelemetryRecorder -ArgumentList (Join-Path $env:RUNNER_TEMP "telemetry-live"), 20779
          $live = New-Object GmLiveUplink -ArgumentList "ws://127.0.0.1:8100/ingest", "test-token"
          $live.Start()
          $recorder.Live = $live
          $recorder.Start()
          Start-Sleep -Seconds 1
          python scripts/telemetry/test_recorder.py send 20779
          Start-Sleep -Seconds 3
          $st = Invoke-RestMethod http://127.0.0.1:8100/status
          $st | ConvertTo-Json -Depth 5
          Write-Host "Uplink status: $($live.Status)"
          $recorder.Stop()
          $live.Stop()
          Stop-Process -Id $server.Id
          if ($st.batches -lt 100) { Write-Host "too few batches arrived"; exit 1 }
          $s = @($st.sessions)[0]
          if (-not $s -or $s.chunks -lt 1 -or $s.cars -lt 2 -or $s.track -ne "Silverstone") { Write-Host "session not stored"; exit 1 }
