name: Build and publish the site

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      previews:
        description: "Also save screenshots of the main pages in previews/"
        type: boolean
        default: false

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # the "What's new" list reads the git history
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Turn race files into site data
        run: node scripts/build-league-data.mjs
      - name: Work out the safety rating
        run: python3 scripts/safety_rating.py
      - name: Rank the Discord award roles
        run: python3 scripts/awards.py
      # GreMi's Setup manager: advice from his telemetry, published only
      # encrypted (the key comes from the staff server after his Discord login)
      - uses: actions/cache@v4
        with:
          path: /tmp/telemetry-cache
          key: telemetry-${{ github.run_id }}
          restore-keys: telemetry-
      - name: Setup manager advice
        run: python3 scripts/telemetry/setup_manager.py /tmp/telemetry-cache /tmp/setups.json || echo "setup advice failed, page shows the last build's data is missing"
      - name: Incident replays for the safety rating page
        run: |
          python3 -m pip install --quiet --break-system-packages numpy || true
          python3 scripts/telemetry/incident_replays.py /tmp/telemetry-cache || echo "incident replays failed, contacts show without a replay"
      - name: Build
        env:
          VITE_BASE_PATH: /race-stats/
          VITE_APP_NAME: GreMi Gang Race Stats
          VITE_DISABLE_ANALYTICS: "true"
          VITE_SKIP_API: "true"
          VITE_SETUP_MANAGER: "true"
        run: |
          pnpm build
          # GitHub Pages has no app routing: serve the app for every unknown path
          cp dist/index.html dist/404.html
      - name: Encrypt the Setup manager advice
        env:
          SETUP_KEY: ${{ secrets.SETUP_KEY }}
        run: if [ -f /tmp/setups.json ]; then node scripts/encrypt-setups.mjs /tmp/setups.json dist/league/setups.enc; fi
      # The leaderboard picture Race Control posts in Discord
      - name: Discord leaderboard picture
        run: |
          mkdir -p /tmp/shots && cd /tmp/shots && npm init -y >/dev/null && npm i --silent playwright@1 && npx playwright install --with-deps chromium >/dev/null
          cd /tmp/shots && node "$GITHUB_WORKSPACE/scripts/discord-card.mjs" "$GITHUB_WORKSPACE/dist"
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

      # Screenshots of the main pages, saved in previews/ when asked for
      - name: Screenshots
        if: inputs.previews
        run: |
          cd /tmp/shots && node "$GITHUB_WORKSPACE/scripts/screenshots.mjs" "$GITHUB_WORKSPACE/dist" "$GITHUB_WORKSPACE/previews"
          cd "$GITHUB_WORKSPACE"
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          cp dist/discord/leaderboard.png previews/discord-leaderboard.png
          rm -rf previews/setups && cp -r dist/discord/setups previews/setups
          rm -rf previews/setup-test && if [ -d dist/discord/setup-test ]; then cp -r dist/discord/setup-test previews/setup-test; fi
          git add previews
          git commit -m "chore: page previews [skip ci]" && git pull --rebase origin main && git push || true

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
