name: Build and publish the site

on:
  push:
    branches: [main]
  schedule:
    - cron: "15 */6 * * *"   # makes the 5 staff grading picks once a stream has finished
  workflow_dispatch:
    inputs:
      previews:
        description: "Also save screenshots of the main pages in previews/"
        type: boolean
        default: false

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # the "What's new" list reads the git history
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      # A new dependency added without network access (Claude's container) comes in here once,
      # and the updated lockfile is saved back to main
      - run: pnpm install --frozen-lockfile || pnpm install --no-frozen-lockfile
      - name: Save an updated lockfile
        run: |
          if ! git diff --quiet pnpm-lock.yaml; then
            git config user.name "github-actions"
            git config user.email "github-actions@users.noreply.github.com"
            git add pnpm-lock.yaml
            git commit -m "chore: update pnpm-lock.yaml [skip ci]"
            git push origin HEAD:main || echo "lockfile not saved, the next build installs again"
          fi
      - uses: actions/cache@v4
        with:
          path: /tmp/telemetry-cache
          key: telemetry-${{ github.run_id }}
          restore-keys: telemetry-
      # Hidden names from the classification screen (uploader/ClassificationCapture.ps1):
      # decrypted here only, written to .cache (never committed), used by the next step
      - name: Read the classification screens
        env:
          GITHUB_TOKEN: ${{ github.token }}
          CLASSIFICATION_KEY: ${{ secrets.CLASSIFICATION_KEY }}
        run: |
          python3 -m pip install --quiet --break-system-packages cryptography || true
          python3 scripts/telemetry/classification_ocr.py /tmp/telemetry-cache .cache/classification.json || echo "classification OCR failed, hidden cars keep the usual rules"
      - name: Turn race files into site data
        run: node scripts/build-league-data.mjs
      - name: Fault engine verdicts for the safety rating
        env:
          GITHUB_TOKEN: ${{ github.token }}
          FAULT_JOBS: "4"   # GitHub runners have 4 cores; a rulebook change judges every race again
        run: |
          python3 -m pip install --quiet --break-system-packages numpy || true
          python3 scripts/telemetry/fault_engine.py /tmp/telemetry-cache || echo "fault engine failed, races without verdicts show as not judged"
      # Precedents (GreMi, 3 Nov 2026): every graded incident is saved with its numbers
      # (grading/precedents.json); calls on similar contacts follow the graded call, and a graded
      # incident always gets the grade itself. Needs the race recordings of new grades.
      - name: Precedents from graded incidents
        env:
          FAULT_JOBS: "4"
        run: |
          python3 scripts/telemetry/precedents.py build /tmp/telemetry-cache || echo "precedents not built, the kept ones are used"
          python3 scripts/telemetry/precedents.py apply /tmp/telemetry-cache || echo "precedents not applied, verdicts are the rulebook's"
          if [ -n "$(git status --porcelain grading/precedents.json)" ]; then
            git config user.name "github-actions"
            git config user.email "github-actions@users.noreply.github.com"
            git add grading/precedents.json
            git commit -m "Precedents from graded incidents [skip ci]"
            git pull --rebase --autostash origin main && git push origin HEAD:main || echo "precedents not saved, the next build makes them again"
          fi
      # Five incidents for the staff to grade after every stream (1 low, 1 high severity,
      # 3 gray areas with Claude's take), saved once in grading/ and read by the staff page
      - name: Staff grading picks
        run: |
          python3 scripts/telemetry/grading_batch.py /tmp/telemetry-cache || echo "grading picks failed, the staff page keeps the last ones"
          if [ -n "$(git status --porcelain grading)" ]; then
            git config user.name "github-actions"
            git config user.email "github-actions@users.noreply.github.com"
            git add grading
            git commit -m "Staff grading picks for the last stream [skip ci]"
            git pull --rebase --autostash origin main && git push origin HEAD:main || echo "grading picks not saved, the next build makes them again"
          fi
      - name: Work out the safety rating
        env:
          SR_RULES: v2.2   # GreMi, 3 Nov 2026: SR v2.2 live
        run: python3 scripts/safety_rating.py
      # SR v2.3 simulation (running SR, x10, bonus max 7.5): build log only, the site keeps v2.2
      - name: SR v2.3 simulation (log only)
        env:
          SR_RULES: v2.3
          SR_OUT: /tmp/sr-v23
        run: python3 scripts/safety_rating.py || echo "v2.3 simulation failed"
      # SR v2.4 simulation (GreMi, 4 Nov 2026: position multipliers, dirty race streaks, gravity):
      # build log only, the site keeps v2.2. Prints live v2.2 next to v2.4 per driver.
      - name: SR v2.4 simulation (log only)
        env:
          SR_RULES: v2.4
          SR_OUT: /tmp/sr-v24
          SR24_DATA: sr-sim/v24-input.json.gz
        run: |
          mkdir -p sr-sim
          python3 scripts/safety_rating.py || echo "v2.4 simulation failed"
          if [ -n "$(git status --porcelain sr-sim)" ]; then
            git config user.name "github-actions"
            git config user.email "github-actions@users.noreply.github.com"
            git add sr-sim/v24-input.json.gz
            git commit -m "SR v2.4 simulation input [skip ci]"
            git pull --rebase --autostash origin main && git push origin HEAD:main || echo "sim input not saved"
          fi
      - name: Rank the Discord award roles
        run: python3 scripts/awards.py
      # GreMi's Setup manager: advice from his telemetry, published only
      # encrypted (the key comes from the staff server after his Discord login)
      - name: Setup manager advice
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python3 scripts/telemetry/setup_manager.py /tmp/telemetry-cache /tmp/setups.json || echo "setup advice failed, page shows the last build's data is missing"
      # Versioned in-game setups (setups/registry.json): verdict per change and
      # the next change to try, saved in the game by the Apply run
      - name: Setup loop
        run: |
          python3 scripts/telemetry/setup_loop.py /tmp/telemetry-cache /tmp/setups.json || echo "setup loop failed, the registry stays as it was"
          if [ -n "$(git status --porcelain setups)" ]; then
            git config user.name "github-actions"
            git config user.email "github-actions@users.noreply.github.com"
            git add setups
            git commit -m "Setup loop: verdicts and next versions [skip ci]"
            git pull --rebase --autostash origin main && git push origin HEAD:main || echo "setup loop not saved, the next build makes it again"
          fi
      - name: Incident replays for the safety rating page
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          python3 -m pip install --quiet --break-system-packages numpy || true
          python3 scripts/telemetry/incident_replays.py /tmp/telemetry-cache || echo "incident replays failed, contacts show without a replay"
      - name: Full-race bundles for the race viewer
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python3 scripts/telemetry/race_bundles.py /tmp/telemetry-cache || echo "race bundles failed, the race viewer only shows races from the live server"
      - name: Build
        env:
          VITE_BASE_PATH: /race-stats/
          VITE_APP_NAME: GreMi Gang Race Stats
          VITE_DISABLE_ANALYTICS: "true"
          VITE_SKIP_API: "true"
          VITE_SETUP_MANAGER: "true"
        run: |
          pnpm build
          # GitHub Pages has no app routing: serve the app for every unknown path
          cp dist/index.html dist/404.html
      - name: Encrypt the Setup manager advice
        env:
          SETUP_KEY: ${{ secrets.SETUP_KEY }}
        run: if [ -f /tmp/setups.json ]; then node scripts/encrypt-setups.mjs /tmp/setups.json dist/league/setups.enc; fi
      # The leaderboard picture Race Control posts in Discord
      - name: Discord leaderboard picture
        run: |
          mkdir -p /tmp/shots && cd /tmp/shots && npm init -y >/dev/null && npm i --silent playwright@1
          # a slow page here (e.g. the live server mid-rebuild) must not stop the site from publishing
          cd /tmp/shots && PW_CHANNEL=chrome node "$GITHUB_WORKSPACE/scripts/discord-card.mjs" "$GITHUB_WORKSPACE/dist" || echo "leaderboard picture failed in this build"
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

      # Screenshots of the main pages, saved in previews/ when asked for
      - name: Screenshots
        if: inputs.previews
        run: |
          cd /tmp/shots && PW_CHANNEL=chrome node "$GITHUB_WORKSPACE/scripts/screenshots.mjs" "$GITHUB_WORKSPACE/dist" "$GITHUB_WORKSPACE/previews"
          cd "$GITHUB_WORKSPACE"
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          cp dist/discord/leaderboard.png previews/discord-leaderboard.png
          rm -rf previews/setups && cp -r dist/discord/setups previews/setups
          rm -rf previews/setup-test && if [ -d dist/discord/setup-test ]; then cp -r dist/discord/setup-test previews/setup-test; fi
          git add previews
          git commit -m "chore: page previews [skip ci]" && git pull --rebase --autostash origin main && git push || true

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
