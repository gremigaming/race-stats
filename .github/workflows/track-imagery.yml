# Downloads public-domain aerial imagery (USGS The National Map, imagery only) for an area
# and commits a stitched JPEG plus its bounds to scripts/telemetry/tracks/ for the incident replays.
name: track-imagery
on:
  workflow_dispatch:
    inputs:
      name: {description: "File name, e.g. texas-t1", required: true}
      bbox: {description: "west,south,east,north", required: true}
      mpp: {description: "Ground metres per pixel", required: true, default: "0.25"}
permissions:
  contents: write
jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download and stitch tiles
        run: |
          pip install -q pillow
          python3 - <<'PY'
          import math, json, io, urllib.request
          from PIL import Image
          w, s, e, n = map(float, "${{ inputs.bbox }}".split(","))
          mpp = float("${{ inputs.mpp }}")
          R = 6378137.0
          def merc(lon, lat): return math.radians(lon) * R, math.log(math.tan(math.pi / 4 + math.radians(lat) / 2)) * R
          x0, y0 = merc(w, s); x1, y1 = merc(e, n)
          # web mercator metres are stretched by 1/cos(lat); ask for real ground metres per pixel
          k = 1 / math.cos(math.radians((s + n) / 2))
          W, H = int((x1 - x0) / (mpp * k)), int((y1 - y0) / (mpp * k))
          img = Image.new("RGB", (W, H)); step = 2000
          for i in range(0, W, step):
              for j in range(0, H, step):
                  cw, ch = min(step, W - i), min(step, H - j)
                  bx0 = x0 + i * (x1 - x0) / W; bx1 = x0 + (i + cw) * (x1 - x0) / W
                  by1 = y1 - j * (y1 - y0) / H; by0 = y1 - (j + ch) * (y1 - y0) / H
                  url = ("https://basemap.nationalmap.gov/arcgis/rest/services/USGSImageryOnly/MapServer/export"
                         f"?bbox={bx0},{by0},{bx1},{by1}&bboxSR=3857&imageSR=3857&size={cw},{ch}&format=jpg&f=image")
                  req = urllib.request.Request(url, headers={"User-Agent": "gremigaming-race-stats/1.0"})
                  t = Image.open(io.BytesIO(urllib.request.urlopen(req, timeout=120).read())).convert("RGB")
                  img.paste(t, (i, j))
          assert img.getextrema() != ((0, 0), (0, 0), (0, 0)), "empty imagery"
          name = "${{ inputs.name }}"
          img.save(f"scripts/telemetry/tracks/{name}.jpg", quality=90)
          json.dump({"source": "USGS The National Map, USGSImageryOnly (public domain)", "crs": "EPSG:3857",
                     "x0": x0, "y0": y0, "x1": x1, "y1": y1, "west": w, "south": s, "east": e, "north": n,
                     "metres_per_pixel": mpp, "size": [W, H]},
                    open(f"scripts/telemetry/tracks/{name}.json", "w"), indent=1)
          PY
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scripts/telemetry/tracks
          git commit -m "Aerial imagery for ${{ inputs.name }} (USGS, public domain)" || exit 0
          git pull --rebase origin main && git push origin HEAD:main
