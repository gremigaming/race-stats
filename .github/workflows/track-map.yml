# Downloads OpenStreetMap data for a circuit (track surface, run-off, grass, gravel, kerbs)
# and commits it to scripts/telemetry/tracks/ for the incident replays.
name: track-map
on:
  workflow_dispatch:
    inputs:
      name: {description: "File name, e.g. texas", required: true}
      bbox: {description: "south,west,north,east", required: true}
permissions:
  contents: write
jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download OSM data
        run: |
          mkdir -p scripts/telemetry/tracks
          q="[out:json][timeout:120];(way(${{ inputs.bbox }});relation(${{ inputs.bbox }})[type=multipolygon];);out geom tags;"
          ok=0
          for try in 1 2 3; do
            for url in https://overpass-api.de/api/interpreter https://overpass.private.coffee/api/interpreter https://maps.mail.ru/osm/tools/overpass/api/interpreter https://overpass.kumi.systems/api/interpreter; do
              echo "trying $url"
              code=$(curl -sS -m 150 -A "gremigaming-race-stats/1.0 (github.com/gremigaming/race-stats)" --data-urlencode "data=$q" "$url" -o osm.json -w '%{http_code}' || true)
              echo "status $code, $(wc -c < osm.json 2>/dev/null) bytes"; head -c 300 osm.json; echo
              if [ "$code" = 200 ] && python3 -c "import json;json.load(open('osm.json'))"; then ok=1; break 2; fi
            done
            sleep 20
          done
          [ $ok = 1 ]
          python3 - <<'PY'
          import json, collections
          d = json.load(open("osm.json"))
          keep = []
          for e in d["elements"]:
              t = e.get("tags", {})
              if not t or t.get("building"): continue
              keep.append(e)
          json.dump({"source": "OpenStreetMap contributors (ODbL)", "elements": keep},
                    open("scripts/telemetry/tracks/${{ inputs.name }}-osm.json", "w"), separators=(",", ":"))
          c = collections.Counter()
          for e in keep:
              t = e["tags"]
              for k in ("highway", "area:highway", "surface", "landuse", "natural", "barrier", "leisure", "sport", "landcover"):
                  if k in t: c[f"{k}={t[k]}"] += 1
          print(len(keep), "elements"); [print(k, v) for k, v in c.most_common(60)]
          PY
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scripts/telemetry/tracks
          git commit -m "Track map data for ${{ inputs.name }} (OpenStreetMap)" || exit 0
          git pull --rebase origin main && git push origin HEAD:main
