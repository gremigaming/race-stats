# Downloads OpenStreetMap data for a circuit (track surface, run-off, grass, gravel, kerbs)
# and commits it to scripts/telemetry/tracks/ for the incident replays.
name: track-map
on:
  workflow_dispatch:
    inputs:
      name: {description: "File name, e.g. texas", required: true}
      bbox: {description: "west,south,east,north", required: true}
permissions:
  contents: write
jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download OSM data
        run: |
          mkdir -p scripts/telemetry/tracks
          curl -sS -f -m 300 -A "gremigaming-race-stats/1.0 (github.com/gremigaming/race-stats)" \
            "https://api.openstreetmap.org/api/0.6/map?bbox=${{ inputs.bbox }}" -o osm.xml
          ls -la osm.xml
          python3 - <<'PY'
          import json, collections
          import xml.etree.ElementTree as ET
          root = ET.parse("osm.xml").getroot()
          nodes = {n.get("id"): (float(n.get("lat")), float(n.get("lon"))) for n in root.iter("node")}
          tags = lambda e: {t.get("k"): t.get("v") for t in e.findall("tag")}
          ways, keep = {}, []
          for w in root.iter("way"):
              geom = [nodes[n.get("ref")] for n in w.findall("nd") if n.get("ref") in nodes]
              ways[w.get("id")] = geom
              t = tags(w)
              if t and not t.get("building"):
                  keep.append({"type": "way", "id": int(w.get("id")), "tags": t, "geometry": geom})
          for r in root.iter("relation"):
              t = tags(r)
              if t.get("type") != "multipolygon" or t.get("building"): continue
              members = [{"role": m.get("role"), "geometry": ways.get(m.get("ref"), [])}
                         for m in r.findall("member") if m.get("type") == "way"]
              keep.append({"type": "relation", "id": int(r.get("id")), "tags": t, "members": members})
          json.dump({"source": "OpenStreetMap contributors (ODbL)", "elements": keep},
                    open("scripts/telemetry/tracks/${{ inputs.name }}-osm.json", "w"), separators=(",", ":"))
          c = collections.Counter()
          for e in keep:
              t = e["tags"]
              for k in ("highway", "area:highway", "surface", "landuse", "natural", "barrier", "leisure", "sport", "landcover"):
                  if k in t: c[f"{k}={t[k]}"] += 1
          print(len(keep), "elements"); [print(k, v) for k, v in c.most_common(60)]
          PY
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scripts/telemetry/tracks
          git commit -m "Track map data for ${{ inputs.name }} (OpenStreetMap)" || exit 0
          git pull --rebase origin main && git push origin HEAD:main
