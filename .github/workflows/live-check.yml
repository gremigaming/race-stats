# Stream readiness: is the live race server up, and can viewers load races, maps and the site?
# This container can't reach gremigaming.com, so the check runs on a GitHub runner.
name: live-check
on:
  workflow_dispatch:
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Check live server, replays, maps and site
        run: |
          python3 - <<'PY'
          import json, time, urllib.request
          def get(url):
              t = time.time()
              try:
                  with urllib.request.urlopen(urllib.request.Request(url, headers={"User-Agent": "live-check", "Origin": "https://gremigaming.github.io"}), timeout=20) as r:
                      body = r.read()
                      return r.status, body, round((time.time() - t) * 1000), r.headers.get("Access-Control-Allow-Origin")
              except urllib.error.HTTPError as e:
                  return e.code, e.read(), round((time.time() - t) * 1000), None
              except Exception as e:
                  return None, str(e).encode(), round((time.time() - t) * 1000), None
          bad = 0
          for name, url in [
              ("live status", "https://live.gremigaming.com/status"),
              ("live sessions", "https://live.gremigaming.com/live.json"),
              ("replays index", "https://replays.gremigaming.com/index.json"),
              ("maps index (R2)", "https://replays.gremigaming.com/maps/index.json"),
              ("maps site", "https://maps.gremigaming.com/index.json"),
              ("maps on Pages", "https://gremigaming.github.io/race-stats-maps/index.json"),
              ("stats site", "https://gremigaming.github.io/race-stats/"),
              ("site race list", "https://gremigaming.github.io/race-stats/league/races/index.json"),
          ]:
              code, body, ms, cors = get(url)
              ok = code == 200
              bad += not ok
              print(f"{'OK ' if ok else 'BAD'} {name}: {code} in {ms} ms, CORS={cors}")
              if url.endswith("/status") or not ok:
                  print("    " + body[:1500].decode(errors="replace").replace("\n", "\n    "))
              elif url.endswith("index.json"):
                  try:
                      j = json.loads(body)
                      races = j.get("races") if isinstance(j, dict) else None
                      if races is not None:
                          print(f"    {len(races)} races, newest: {races[0].get('uid') if races else '-'} {races[0].get('started') if races else ''}")
                      else:
                          print(f"    keys: {list(j)[:10] if isinstance(j, dict) else type(j).__name__}")
                  except Exception as e:
                      print(f"    not JSON: {e}")
          print(f"\n{bad} problem(s)")
          PY
      - name: Live viewer socket (wss://live.gremigaming.com/watch)
        run: |
          python3 -m pip install --quiet "websockets>=13,<16"
          python3 - <<'PY'
          import asyncio, json, time
          from websockets.asyncio.client import connect
          async def main():
              t = time.time()
              async with connect("wss://live.gremigaming.com/watch", open_timeout=15) as ws:
                  first = json.loads(await asyncio.wait_for(ws.recv(), 10))
                  print(f"OK  socket answered in {round((time.time() - t) * 1000)} ms: {first['type']}, {len(first['sessions'])} live")
                  for s in first["sessions"][:1]:
                      await ws.send(json.dumps({"watch": s["uid"]}))
                      frames, start = 0, time.time()
                      while time.time() - start < 5:
                          msg = await asyncio.wait_for(ws.recv(), 5)
                          frames += isinstance(msg, bytes)
                      print(f"    {s['track']} {s['session']}: {frames} pushes in 5 s")
          asyncio.run(main())
          PY
