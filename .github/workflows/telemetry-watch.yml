name: Rebuild the site when new telemetry arrives

# RaceUploader.ps1 pushes a race file a few minutes before that session's
# telemetry recording reaches the "telemetry" release, so the build the push
# starts has no recording yet and its contacts get no replay. This rebuilds the
# site once a recording newer than the last site build has arrived.
on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

permissions:
  actions: write
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          newest=$(gh api "repos/$REPO/releases/tags/telemetry" --jq '[.assets[].updated_at] | max // ""')
          built=$(gh api "repos/$REPO/actions/workflows/site.yml/runs?per_page=1" --jq '.workflow_runs[0].created_at // ""')
          echo "newest recording: $newest, last site build: $built"
          if [[ -n "$newest" && "$newest" > "$built" ]]; then
            gh workflow run site.yml --repo "$REPO" --ref main
          fi
